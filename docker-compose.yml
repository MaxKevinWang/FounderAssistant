version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: founder_assistant_db
    environment:
      POSTGRES_DB: founder_assistant
      POSTGRES_USER: founder
      POSTGRES_PASSWORD: founder
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: founder_assistant_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: founder_assistant_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env.example
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: founder_assistant_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pg_data:
